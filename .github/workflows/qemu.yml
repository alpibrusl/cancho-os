name: boot in qemu
on: [push, pull_request]
env:
  # cancho's bare-metal target (`--target aarch64-none-elf`, alpibrusl/cancho#826) is on its main branch
  CANCHO_REF: main
jobs:
  boot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm qemu-system-arm net-tools netcat-openbsd iputils-ping dnsmasq-base
      - name: cancho, built from its seed by itself
        # The bare-metal target (cancho docs/freestanding.md) is newer than the committed seed, so the
        # compiler is built from source: the seed builds stage 1, which builds the cancho used here.
        run: |
          git clone --depth 1 --branch "$CANCHO_REF" https://github.com/alpibrusl/cancho /tmp/cancho
          sh /tmp/cancho/scripts/build-standalone.sh --out /tmp/cancho-out --rev "$(git -C /tmp/cancho rev-parse HEAD)"
      - name: build
        run: CANCHO=/tmp/cancho-out/cancho ./build.sh
      - name: the network stack, on this machine
        # src/inet.cho holds no hardware, so its tests run here: published checksum vectors, packets a
        # second implementation built, and every one-byte damage to a packet (nothing traps)
        run: |
          /tmp/cancho-out/cancho test tests/inet_test.cho src/inet.cho --std
          # TCP: whole conversations against segments the second implementation built, with the time made up
          /tmp/cancho-out/cancho test tests/tcp_test.cho src/inet.cho --std
          # the gateway, datagrams, names and a given address
          /tmp/cancho-out/cancho test tests/addr_test.cho src/inet.cho --std
      - name: what the kernel can touch
        run: CANCHO=/tmp/cancho-out/cancho ./authority.sh
      - name: boot and drive the shell
        run: |
          ./test.sh about 'echo ci' ticks crash about > out.txt
          cat out.txt
          grep -q "no Linux underneath (Raspberry Pi 3)" out.txt
          grep -q "^ci" out.txt
          # milestone 2: the timer interrupt fires, and a cancho trap is reported, then the core halts
          grep -Eq "^[1-9][0-9]* timer interrupts" out.txt
          grep -q "cancho trap" out.txt
          test "$(grep -c "no Linux underneath" out.txt)" = 1
          # milestone 3: the MMU is on: page 0 is unmapped and kernel code is read-only
          ./test.sh mem 'crash null' > null.txt; cat null.txt
          grep -q "r-x  kernel code" null.txt
          grep -q "data abort: address not mapped" null.txt
          ./test.sh 'crash write' > write.txt; cat write.txt
          grep -q "data abort: write to read-only memory" write.txt
          # the robot: six simulated servos on the second serial port; ids 7 and 8 are not there
          SERVOS=1 ./test.sh 'servo scan' 'servo pos' > servo.txt; cat servo.txt
          grep -q "^6 servos found" servo.txt
          grep -q "^servo 7: no answer" servo.txt
          grep -q "^servo 3: position 2348" servo.txt
          # the arm: the zero pose is where placo puts it (cancho-robot tests/kinematics_test.cho), to the micrometre
          ./test.sh 'arm zero' > zero.txt; cat zero.txt
          grep -q "^gripper at x 391361 y -9 z 226469 um" zero.txt
          # the pose from the simulated servos, and the safety core's verdict on four requests (approved,
          # approved but slowed, a joint limit, a collision), are what the same sources say on this machine
          SERVOS=1 ./test.sh 'arm pose' 'arm check -2 14 33 -41 44' 'arm check 5 14 33 -41 44' \
              'arm check -2 14 33 -41 400' 'arm check 60 14 33 -41 44' > arm.txt; cat arm.txt
          grep -E "^(joint|gripper|approved|refused|goals|nothing)" arm.txt > arm-kernel.txt
          ./build/expect > expect.txt
          test "$(wc -l < arm-kernel.txt)" -eq 16 && diff arm-kernel.txt expect.txt
          grep -q "^refused: limit.joint (joint 5)" arm-kernel.txt
      - name: what the firmware says the board is
        # the mailbox, asked three questions (docs/genet.md); QEMU's Pi 3 answers, its virt has none to ask
        run: |
          ./test.sh board > board.txt; cat board.txt
          grep -Eq "^revision 00a02082, serial [0-9a-f]{16}, card address ([0-9a-f]{2}:){5}[0-9a-f]{2}$" board.txt
          MACHINE=virt ./test.sh board > noboard.txt; cat noboard.txt
          grep -q "^this board has no firmware to ask" noboard.txt
      - name: a kernel loaded over the serial console
        # the running kernel takes another (this build, renamed 0.0.99) and starts it: a wrong checksum
        # must forget it, the right one must run it, and the fault report must still work afterwards
        run: |
          # (as a Pi 3 and on virt: this runner's QEMU has no Pi 4)
          for m in raspi3b virt; do
            MACHINE=$m ./load.sh > load-$m.txt 2>&1 || { cat load-$m.txt; exit 1; }
            grep -E "Linux underneath|forgotten|starting it|data abort" load-$m.txt
          done
          # and it is not offered over the network shell
          MACHINE=virt RSH='load 2000\n' ./test.sh 'net up' 'net shell on' net > noload.txt; cat noload.txt
          grep -q "^remote: > unknown command" noload.txt
      - name: the network link
        run: |
          # sim/netpeer.cho on the second serial port: three replies it insists on byte for byte, and one
          # corrupted packet the kernel must not answer
          # then the kernel speaks first: its ping of the peer is answered
          NET=1 ./test.sh 'net up' 'echo wait' 'echo wait' 'ping 10.0.0.1' net 'servo scan' > net.txt; cat net.txt
          grep -q "^peer: 3 replies to 4 packets, as it should be" net.txt
          grep -q "^reply from 10.0.0.1 in " net.txt
          grep -q "^3 packets answered, 1 dropped (the last: checksum)" net.txt
          grep -q "the second serial port is the network link" net.txt
      - name: ping, from Linux's own stack
        # not our packets this time: the kernel's SLIP driver on the other end of the line, and the system's ping
        run: |
          sudo BYTES=16384 ./ping.sh > ping.txt 2>&1 || { cat ping.txt; exit 1; }
          cat ping.txt
          grep -q " 0% packet loss" ping.txt
          grep -q "^udp echo: 'cancho-os over udp'" ping.txt
          # TCP over the same line, opened and closed by Linux; the kernel's own ping, answered by Linux
          grep -q "^tcp echo: 'cancho-os over tcp'" ping.txt
          grep -q "^tcp echo: 16384 bytes came back the same" ping.txt
          grep -qi "^tcp port 9: .*refused" ping.txt
          grep -q "^reply from 10.0.0.1 in " ping.txt
          grep -qi "^tcp port 23, before: .*refused" ping.txt
          grep -q "^remote: > cancho-os .* no Linux underneath" ping.txt
          grep -q "^remote: .*r-x  kernel code" ping.txt
          grep -q "^exit: shell on port 23: nobody connected" ping.txt
          grep -q "^exit: the kernel said bye" ping.txt
          grep -q "^a page from linux, for cancho-os" ping.txt
          grep -q "^no connection to 10.0.0.1 port 8098: refused, or no answer" ping.txt
      - name: QEMU's virt machine, and its network card
        run: |
          # the same kernel linked for a board whose RAM starts at 1 GB: the shell, the timer, the MMU, a fault
          MACHINE=virt ./test.sh about ticks mem 'crash null' > virt.txt; cat virt.txt
          grep -q "no Linux underneath (QEMU virt)" virt.txt
          grep -Eq "^[1-9][0-9]* timer interrupts" virt.txt
          grep -q "0x40080000 - .*r-x  kernel code" virt.txt
          grep -q "data abort: address not mapped" virt.txt
          # the card: a datagram from this machine through QEMU's network, which asks who has 10.0.0.2 first
          MACHINE=virt UDP='hello from the host' ./test.sh 'net up' net > ether.txt; cat ether.txt
          grep -q "^link up: virtio-net, card 52:54:00:12:34:56, address 10.0.0.2" ether.txt
          grep -q "^udp echo: 'hello from the host'" ether.txt
          grep -q "^2 packets answered, 0 dropped" ether.txt
          # a connection: the host's TCP (QEMU's own, here) opens it, sends 200 KB and reads them back;
          # then the kernel asks who 10.0.0.1 is and pings it
          head -c 200000 /dev/urandom > big.bin
          MACHINE=virt TCP='hello over tcp' TCPFILE=big.bin ./test.sh 'net up' 'ping 10.0.0.1' net > tcp.txt; cat tcp.txt
          grep -q "^tcp echo: 'hello over tcp'" tcp.txt
          grep -q "^tcp echo: 200000 bytes came back the same" tcp.txt
          grep -q "^reply from 10.0.0.1 in " tcp.txt
          grep -q "^tcp: 0 open" tcp.txt
          # the kernel opens a connection: a page from a web server on this machine, through QEMU's TCP; a port
          # with no server; and both again typed over the shell's connection, which `exit` then ends
          mkdir -p www && echo "a page from the host, for cancho-os" > www/index.html
          (cd www && exec python3 -m http.server 8099 --bind 127.0.0.1) > /dev/null 2>&1 &
          sleep 1
          MACHINE=virt RSH='http 10.0.0.1 8099\nexit\nabout\n' ./test.sh 'net up' 'net shell on' 'http 10.0.0.1 8099' 'http 10.0.0.1 8098' net > http.txt; cat http.txt
          grep -q "^a page from the host, for cancho-os" http.txt
          grep -q "^no connection to 10.0.0.1 port 8098: refused, or no answer" http.txt
          grep -q "^remote: a page from the host, for cancho-os" http.txt
          grep -q "^remote: > bye" http.txt
          ! grep -q "^remote: .*no Linux underneath" http.txt
          grep -q "^tcp: 0 open" http.txt
          # an address from QEMU's own DHCP server, and the page again from that address; a name asked of
          # QEMU's name server is not insisted on (it needs the runner's resolver), a name that is none is
          MACHINE=virt ./test.sh 'net up' 'lookup example.com' 'net dhcp' net 'lookup bad..name' 'ping 10.0.0.1' 'http 10.0.0.1 8099' 'lookup example.com' > dhcp.txt; cat dhcp.txt
          grep -q "^no name server is known" dhcp.txt
          grep -q "^address 10.0.0.15, mask 255.255.255.0, gateway 10.0.0.1, names from 10.0.0.3" dhcp.txt
          grep -q "^link up: virtio-net, card 52:54:00:12:34:56, address 10.0.0.15" dhcp.txt
          grep -q "^not a name: bad..name" dhcp.txt
          grep -q "^reply from 10.0.0.1 in " dhcp.txt
          grep -q "^a page from the host, for cancho-os" dhcp.txt
          # on the serial line there is nobody to ask
          ./test.sh 'net up' 'net dhcp' > nodhcp.txt; cat nodhcp.txt
          grep -q "^an address is asked for on a network card" nodhcp.txt
          # randomness: the virtual generator here, the Pi 3's own on that board, none on QEMU's Pi 4 (which
          # has no such device); two draws are 32 hex digits each and differ
          MACHINE=virt ./test.sh random random 'net up' net > rng.txt; cat rng.txt
          test "$(grep -Ec '^random \(virtio-rng\): [0-9a-f]{32}$' rng.txt)" = 2
          test "$(grep '^random' rng.txt | sort -u | wc -l)" = 2
          grep -q "^connections begin at a random number (virtio-rng)" rng.txt
          ./test.sh random random > rng3.txt; cat rng3.txt
          test "$(grep -Ec '^random \(the BCM2835 generator\): [0-9a-f]{32}$' rng3.txt)" = 2
          test "$(grep '^random' rng3.txt | sort -u | wc -l)" = 2
          NORNG=' ' MACHINE=virt ./test.sh random 'net up' net > norng.txt; cat norng.txt
          grep -q "^this board gave the kernel no source of randomness" norng.txt
          grep -q "^connections begin at the counter's value" norng.txt
          # the shell over a connection: closed until the console opens it, then seven commands typed from this
          # machine, among them one that must be refused from there
          MACHINE=virt RSH='about\nticks\nnet\nnet shell on\nping 10.0.0.1\nmem\n' ./test.sh 'net up' 'net shell on' net > rsh.txt; cat rsh.txt
          grep -q "^remote: > cancho-os .* no Linux underneath (QEMU virt)" rsh.txt
          grep -Eq "^remote: > [1-9][0-9]* timer interrupts" rsh.txt
          grep -q "^remote: shell on port 23: a session is open" rsh.txt
          grep -q "^remote: > only from the serial console" rsh.txt
          grep -q "^remote: > reply from 10.0.0.1 in " rsh.txt
          grep -q "^remote:   0x40080000 - .*r-x  kernel code" rsh.txt
          grep -q "^tcp: 0 open" rsh.txt
      - name: ping over Ethernet, from Linux's own stack
        # the card on a tap interface: Linux's ARP, the system's ping and nc, none of it ours
        run: |
          sudo MACHINE=virt ./ping.sh > eping.txt 2>&1 || { cat eping.txt; exit 1; }
          cat eping.txt
          grep -q " 0% packet loss" eping.txt
          grep -q "^udp echo: 'cancho-os over udp'" eping.txt
          grep -q "10.0.0.2 lladdr 52:54:00:12:34:56" eping.txt
          # dnsmasq gave the address and answered for the names; then 10.0.0.1 was reached by the gateway
          grep -q "DHCPACK(tap0) 172.31.77.5" eping.txt
          grep -q "^address 172.31.77.5[0-9], mask 255.255.255.0, gateway 172.31.77.1, names from 172.31.77.1" eping.txt
          grep -q "^www.cancho-os.test is 172.31.77.1" eping.txt
          grep -q "^no such name: nothing.cancho-os.test" eping.txt
          grep -q "^link up: virtio-net, card 52:54:00:12:34:56, address 172.31.77.5" eping.txt
          grep -q "^tcp echo: 'cancho-os over tcp'" eping.txt
          grep -q "^tcp echo: 65536 bytes came back the same" eping.txt
          grep -qi "^tcp port 9: .*refused" eping.txt
          grep -q "^reply from 10.0.0.1 in " eping.txt
          grep -qi "^tcp port 23, before: .*refused" eping.txt
          grep -q "^remote: > cancho-os .* no Linux underneath" eping.txt
          grep -q "^remote: .*r-x  kernel code" eping.txt
          grep -q "^exit: shell on port 23: nobody connected" eping.txt
          grep -q "^exit: the kernel said bye" eping.txt
          grep -q "^a page from linux, for cancho-os" eping.txt
          grep -q "^no connection to 10.0.0.1 port 8098: refused, or no answer" eping.txt
