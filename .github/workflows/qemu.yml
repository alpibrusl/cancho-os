name: boot in qemu
on: [push, pull_request]
env:
  # the cancho branch that has `--target aarch64-none-elf`; `main` once it is merged there
  CANCHO_REF: freestanding
jobs:
  boot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm qemu-system-arm
      - name: cancho, built from its seed by itself
        # The bare-metal target (cancho docs/freestanding.md) is newer than the committed seed, so the
        # compiler is built from source: the seed builds stage 1, which builds the cancho used here.
        run: |
          git clone --depth 1 --branch "$CANCHO_REF" https://github.com/alpibrusl/cancho /tmp/cancho
          sh /tmp/cancho/scripts/build-standalone.sh --out /tmp/cancho-out --rev "$(git -C /tmp/cancho rev-parse HEAD)"
      - name: build
        run: CANCHO=/tmp/cancho-out/cancho ./build.sh
      - name: boot and drive the shell
        run: |
          ./test.sh about 'echo ci' ticks crash about > out.txt
          cat out.txt
          grep -q "no Linux underneath (Raspberry Pi 3)" out.txt
          grep -q "^ci" out.txt
          # milestone 2: the timer interrupt fires, and a cancho trap is reported, then the core halts
          grep -Eq "^[1-9][0-9]* timer interrupts" out.txt
          grep -q "cancho trap" out.txt
          test "$(grep -c "no Linux underneath" out.txt)" = 1
          # milestone 3: the MMU is on: page 0 is unmapped and kernel code is read-only
          ./test.sh mem 'crash null' > null.txt; cat null.txt
          grep -q "r-x  kernel code" null.txt
          grep -q "data abort: address not mapped" null.txt
          ./test.sh 'crash write' > write.txt; cat write.txt
          grep -q "data abort: write to read-only memory" write.txt
          # the robot: six simulated servos on the second serial port; ids 7 and 8 are not there
          SERVOS=1 ./test.sh 'servo scan' 'servo pos' > servo.txt; cat servo.txt
          grep -q "^6 servos found" servo.txt
          grep -q "^servo 7: no answer" servo.txt
          grep -q "^servo 3: position 2348" servo.txt
